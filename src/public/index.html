<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>在场｜Agent 过程对账台</title>
  <style>
    :root{--ink:#17211f;--muted:#64716d;--line:#d9e2de;--paper:#f7faf8;--card:#fff;--teal:#0d766d;--teal-dark:#07564f;--red:#c84c48;--blue:#3677b8;--green:#278157;--gray:#87938e;--amber:#b17625;--shadow:0 14px 40px #1d3d3210}
    *{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 Inter,ui-sans-serif,system-ui,-apple-system,"PingFang SC","Microsoft Yahei",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer;border:1px solid var(--line);border-radius:8px;background:white;color:var(--ink);padding:8px 12px}button:hover{border-color:var(--teal);color:var(--teal-dark)}button:disabled{cursor:wait;opacity:.55}.primary{background:var(--teal);border-color:var(--teal);color:white}.primary:hover{background:var(--teal-dark);color:white}.danger{color:#a33a37;border-color:#e4afad}.shell{max-width:1440px;margin:auto;padding:24px 30px 50px}.topbar{display:flex;justify-content:space-between;gap:18px;align-items:flex-start;margin-bottom:24px}.brand{display:flex;gap:13px;align-items:center}.mark{background:var(--ink);color:#dff4ec;border-radius:10px;padding:11px 12px;font-weight:800;letter-spacing:.08em}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--teal);font-weight:800;text-transform:uppercase}.title{font-size:28px;line-height:1.2;font-weight:800;letter-spacing:-.03em}.subtitle{color:var(--muted);margin-top:3px}.top-actions{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}.layout{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(330px,.8fr);gap:18px;align-items:start}.stack{display:grid;gap:18px}.panel{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;box-shadow:var(--shadow)}.panel-head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:14px}.panel h2,.panel h3{margin:0}.panel h2{font-size:16px}.panel h3{font-size:13px}.small{font-size:12px;color:var(--muted)}.notice{padding:11px 12px;background:#eef7f3;border-left:3px solid var(--teal);border-radius:7px;color:#30534a}.warning{background:#fff7e9;border-left-color:var(--amber);color:#795426}.error{background:#fff0ef;border-left-color:var(--red);color:#863d3a}.field{display:grid;gap:5px;margin-bottom:11px}.field label{font-size:12px;font-weight:700;color:var(--muted)}input,textarea,select{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 10px;background:#fcfefd;color:var(--ink)}textarea{resize:vertical;min-height:72px}.spec-grid{display:grid;grid-template-columns:1.2fr .8fr;gap:12px}.mode-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}.mode{border:1px solid var(--line);padding:11px;border-radius:9px;text-align:left;background:#fbfdfc}.mode.selected{border:2px solid var(--teal);padding:10px;background:#eff9f6}.mode strong{display:block}.mode span{display:block;color:var(--muted);font-size:12px;margin-top:3px}.toolbar{display:flex;gap:7px;flex-wrap:wrap;align-items:center}.status{min-height:21px;color:var(--muted);margin:10px 0 0}.statbar{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-bottom:15px}.stat{border:1px solid var(--line);border-radius:9px;padding:10px;background:#fbfdfc}.stat b{display:block;font-size:22px;line-height:1.1}.stat span{display:block;font-size:11px;color:var(--muted);margin-top:3px}.steps{display:grid;gap:10px}.step{border:1px solid var(--line);border-radius:11px;overflow:hidden;background:#fff}.step-head{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 12px;background:#f6faf8;border-bottom:1px solid var(--line)}.step-label{font-weight:800}.step-body{display:grid;grid-template-columns:1fr 1fr}.ledger{padding:13px;border-right:1px solid var(--line);min-height:95px}.ledger:last-child{border-right:0}.ledger-title{font-size:11px;color:var(--muted);font-weight:800;margin-bottom:7px}.ledger p{margin:0}.agent-line{font-weight:700}.card{border:1px solid var(--line);border-left:4px solid var(--gray);border-radius:9px;padding:11px;margin-top:10px;background:#fff}.card.red{border-left-color:var(--red);background:#fffafa}.card.blue{border-left-color:var(--blue)}.card.green{border-left-color:var(--green);background:#f8fdf9}.card.gray{border-left-color:var(--gray);background:#fbfcfc}.card.failed{border-left-color:var(--amber);background:#fffaf1}.card-top{display:flex;justify-content:space-between;gap:8px;align-items:center}.pill{display:inline-flex;align-items:center;border-radius:99px;padding:2px 8px;font-size:11px;font-weight:800;letter-spacing:.04em}.pill.red{color:#923e3a;background:#ffe1df}.pill.blue{color:#285b8c;background:#e2effb}.pill.green{color:#1d6d48;background:#dcf4e6}.pill.gray{color:#5d6965;background:#e8eeeb}.pill.amber{color:#805921;background:#ffedc9}.card p{margin:7px 0}.card-meta{display:flex;gap:9px;flex-wrap:wrap;color:var(--muted);font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:10px}.actions input{flex:1;min-width:180px}.details{margin-top:9px;padding-top:9px;border-top:1px solid var(--line)}.details pre{white-space:pre-wrap;word-break:break-word;margin:5px 0;font:12px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;color:#40504b}.sidebar-list{display:grid;gap:8px;max-height:530px;overflow:auto}.mini-card{padding:10px 11px;border:1px solid var(--line);border-left:3px solid var(--blue);border-radius:8px;background:#fbfdff}.mini-card.green{border-left-color:var(--green);background:#f8fdf9}.mini-card p{margin:4px 0}.filters{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px}.timeline{display:grid;gap:0;max-height:520px;overflow:auto;margin-top:11px}.event{padding:9px 2px;border-bottom:1px solid #edf2ef}.event-row{display:flex;gap:8px;align-items:baseline}.seq{color:var(--teal);font:11px ui-monospace,monospace;min-width:30px}.event b{font-size:12px}.event p{margin:2px 0 0 38px;color:var(--muted);font-size:12px}.branches{display:grid;gap:7px}.branch{display:flex;justify-content:space-between;gap:10px;padding:9px;border:1px solid var(--line);border-radius:8px}.branch.active{border-color:var(--teal);background:#eff9f6}.report-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}.report-item{padding:9px;background:#f7faf8;border-radius:8px}.report-item b{display:block;font-size:19px}.report-item span{font-size:11px;color:var(--muted)}.correction{padding:9px;border-left:3px solid var(--teal);background:#f5faf8;margin-top:8px;font-size:12px}.empty{color:var(--muted);padding:20px 4px;text-align:center}.session-row{display:flex;gap:7px;align-items:center}.session-row select{max-width:250px}.replay{display:flex;align-items:center;gap:8px;margin-top:10px}.progress{height:5px;background:#e6eeea;border-radius:99px;overflow:hidden;flex:1}.progress i{display:block;height:100%;background:var(--teal)}@media(max-width:980px){.layout{grid-template-columns:1fr}.sidebar-list,.timeline{max-height:420px}}@media(max-width:650px){.shell{padding:16px 12px 35px}.topbar{display:block}.top-actions{justify-content:flex-start;margin-top:14px}.spec-grid,.step-body{grid-template-columns:1fr}.ledger{border-right:0;border-bottom:1px solid var(--line)}.ledger:last-child{border-bottom:0}.statbar{grid-template-columns:repeat(3,1fr)}.filters{grid-template-columns:1fr}.mode-row{grid-template-columns:1fr}.title{font-size:24px}}
    @media print{body{background:#fff}.shell{max-width:none;padding:0}.topbar,.setup,.timeline-panel,.cards-panel,.sidebar-only,.no-print{display:none!important}.layout{display:block}.report-panel{display:block!important;box-shadow:none;border:0}.panel{box-shadow:none;border-color:#bbb}.report-grid{grid-template-columns:repeat(4,1fr)} }
  </style>
</head>
<body>
<div class="shell">
  <header class="topbar">
    <div class="brand"><div class="mark">在场</div><div><div class="eyebrow">Decision Stream / local workbench</div><div class="title">Agent 过程对账台</div><div class="subtitle">不审每一行 diff，只把关键决定、证据和人的纠偏放在一起。</div></div></div>
    <div class="top-actions"><button id="demoButton" class="primary">运行完整演示</button><button id="printButton">打印一页报告</button></div>
  </header>
  <div id="globalNotice" class="notice" role="status">本地单用户模式。没有外部模型，演示动作由 deterministic judge、recorder 和受控 executor 完成。</div>
  <div class="layout">
    <main class="stack">
      <section class="panel setup">
        <div class="panel-head"><div><h2>01 / 建立会话与短 spec</h2><div class="small">模式在创建时锁定，历史不会被静默改写。</div></div><div class="session-row"><select id="sessionSelect" aria-label="选择 session"><option>加载中…</option></select><button id="newSessionButton">新会话</button></div></div>
        <div class="spec-grid">
          <div><div class="field"><label for="request">一句话需求</label><textarea id="request">做一个可被学生使用的数据库功能，能安全保存报名信息</textarea></div><div class="field"><label for="constraint">已确认约束（每行一条）</label><textarea id="constraint">存储必须使用 Postgres，不允许 SQLite
          <div><div class="field"><label>纠偏模式</label><div class="mode-row"><button class="mode selected" data-mode="forward-only"><strong>forward-only</strong><span>不回写历史，只约束后续步骤</span></button><button class="mode" data-mode="rewind-and-fork"><strong>rewind-and-fork</strong><span>已完成 turn 边界 fork，保留原分支</span></button></div></div><div id="modeNotice" class="notice">当前：forward-only。纠偏后原动作保留，约束只进入未来。</div><div class="actions"><button id="confirmButton" class="primary">确认 spec 并开工</button></div></div>
        </div><p id="status" class="status" aria-live="polite"></p>
      </section>
      <section class="panel cards-panel"><div class="panel-head"><div><h2>02 / 过程对账</h2><div class="small">每个粗粒度 step 左右对照人类指令与 Agent 实际动作；细节默认收起。</div></div><div id="activeBranch" class="pill gray">尚未开工</div></div><div id="steps" class="steps"><div class="empty">确认 spec 后，过程会出现在这里。</div></div></section>
      <section class="panel sidebar-only"><div class="panel-head"><div><h2>蓝卡侧栏</h2><div class="small">自主选择不阻断执行，人在方便时再翻案。</div></div><span id="blueCount" class="pill blue">0 张</span></div><div id="blueCards" class="sidebar-list"><div class="empty">暂无蓝卡</div></div></section>
      <section class="panel report-panel"><div class="panel-head"><div><h2>04 / 一页报告</h2><div class="small">归因人的判断，不归因代码行。只把真实 evidence 标为 green。</div></div><button id="reportRefresh" class="no-print">刷新报告</button></div><div id="reportContent"><div class="empty">暂无会话报告</div></div></section>
    </main>
    <aside class="stack">
      <section class="panel timeline-panel"><div class="panel-head"><div><h2>03 / 全局时间线</h2><div class="small">多 Agent 合并顺序 · 来源 · turn / step</div></div><span id="eventCount" class="small">0 events</span></div><div class="filters"><select id="agentFilter" aria-label="按 agent 过滤"><option value="">所有 agent</option></select><select id="branchFilter" aria-label="按 branch 过滤"><option value="">所有 branch</option></select><select id="eventFilter" aria-label="按事件类型过滤"><option value="">所有事件</option></select></div><div class="replay"><button id="prevButton">上一步</button><button id="nextButton">下一步</button><button id="playButton">自动播放</button><div class="progress"><i id="progressBar" style="width:100%"></i></div><span id="replayLabel" class="small">完整</span></div><div id="timeline" class="timeline"><div class="empty">暂无事件</div></div></section>
      <section class="panel"><div class="panel-head"><div><h2>分支与边界</h2><div class="small">fork 不撤销已发生的外部副作用。</div></div></div><div id="branches" class="branches"><div class="empty">暂无分支</div></div></section>
      <section class="panel"><h2>运行状态</h2><div id="runtimeStatus" class="notice" style="margin-top:12px">等待 session</div></section>
    </aside>
  </div>
</div>
<script>
(() => {
  'use strict'
  let sessionId = ''; let state = null; let selectedMode = 'forward-only'; let busy = false; let decisionBusy = false; let playback = -1; let timer = null
  const $ = (id) => document.getElementById(id)
  const text = (tag, value, className) => { const node = document.createElement(tag); node.textContent = value == null ? '' : String(value); if (className) node.className = className; return node }
  const button = (label, handler, className) => { const node = text('button', label, className); node.addEventListener('click', handler); return node }
  const setNotice = (message, kind) => { const node = $('globalNotice'); node.textContent = message; node.className = `notice ${kind || ''}` }
  async function request(path, options) { const response = await fetch(path, options); let payload; try { payload = await response.json() } catch (_) { throw new Error(`服务器返回无效数据（${response.status}）`) } if (!response.ok) throw new Error(payload.error?.message || `请求失败（${response.status}）`); return payload }
  const post = (path, value) => request(path, { method:'POST', headers:{'content-type':'application/json'}, body:JSON.stringify(value || {}) })
  const wait = (ms) => new Promise(resolve => setTimeout(resolve, ms))
  function modeLabel(mode) { return mode === 'rewind-and-fork' ? 'rewind-and-fork' : 'forward-only' }
  function lines(value) { return value.split('\n').map(item => item.trim()).filter(Boolean) }
  function cardTone(card) { return card.state === 'verified' ? 'green' : card.state === 'failed' ? 'failed' : card.verdict.kind }
  function stateLabel(card) { const labels = {pending:'等待裁决',allowed:'已执行 / 待验证',overridden:'已纠偏',cancelled:'已叫停',interrupted:'重启中断',verified:'已验证 green',failed:'运行失败'}; return labels[card.state] || card.state }
  async function refresh() { if (!sessionId) return; try { state = await request(`/api/sessions/${encodeURIComponent(sessionId)}/state`); render() } catch (error) { setNotice(error.message, 'error') } }
  async function loadSessions() { try { const sessions = await request('/api/sessions'); const select = $('sessionSelect'); select.replaceChildren(); if (!sessions.length) { select.append(text('option','暂无 session')); return } sessions.forEach(item => { const option = text('option', `${item.sessionId.slice(0,18)} · ${modeLabel(item.mode)}`); option.value = item.sessionId; option.selected = item.sessionId === sessionId; select.append(option) }); if (!sessionId) { sessionId = sessions[0].sessionId; select.value = sessionId; await refresh() } } catch (error) { setNotice(`无法读取 session：${error.message}`, 'error') } }
  function render() { if (!state) return; $('status').textContent = state.spec ? `已确认：${state.spec.request} · 模式锁定为 ${modeLabel(state.mode)}` : '等待确认 spec'; $('activeBranch').textContent = state.branches.find(item => item.active)?.id || 'main'; $('activeBranch').className = 'pill green'; renderFilters(); renderSteps(); renderBlueCards(); renderTimeline(); renderBranches(); renderReport(); const pending = state.cards.filter(card => card.state === 'pending').length; $('runtimeStatus').textContent = pending ? `有 ${pending} 张红卡正在阻断，等待人的裁决。` : `${state.cards.length} 个 step 已记录，${state.report.verified} 个有 executor evidence。`; $('runtimeStatus').className = `notice ${pending ? 'warning' : ''}` }
  function renderFilters() { const fill = (id, values, label) => { const current = $(id).value; const select = $(id); select.replaceChildren(text('option', label)); values.forEach(value => { const option = text('option', value); option.value = value; option.selected = value === current; select.append(option) }) }; fill('agentFilter', [...new Set(state.timeline.map(e => e.agentId).filter(Boolean))], '所有 agent'); fill('branchFilter', state.branches.map(b => b.id), '所有 branch'); fill('eventFilter', [...new Set(state.timeline.map(e => e.type))], '所有事件') }
  function renderSteps() { const root = $('steps'); root.replaceChildren(); if (!state.cards.length) { root.append(text('div','确认 spec 后，过程会出现在这里。','empty')); return } state.cards.forEach(card => { const step = document.createElement('article'); step.className = 'step'; const head = document.createElement('div'); head.className = 'step-head'; head.append(text('span', `turn ${card.turn} / step ${card.step}`, 'step-label')); const tone = cardTone(card); head.append(text('span', `${card.verdict.kind.toUpperCase()} · ${stateLabel(card)}`, `pill ${tone === 'failed' ? 'amber' : tone}`)); step.append(head); const body = document.createElement('div'); body.className = 'step-body'; const human = document.createElement('div'); human.className = 'ledger'; human.append(text('div','人说了什么','ledger-title')); human.append(text('p', state.spec?.request || '尚未提供人类指令')); if (card.appliedConstraint) human.append(text('p', `纠偏约束：${card.appliedConstraint}`,'small')); const agent = document.createElement('div'); agent.className = 'ledger'; agent.append(text('div','Agent 实际做了什么','ledger-title')); agent.append(text('p', card.action.description,'agent-line')); agent.append(text('div', `${card.action.tool} · ${card.action.kind} · ${card.action.agentId || 'demo-agent'}`,'small')); body.append(human, agent); step.append(body); const cardBox = document.createElement('div'); cardBox.className = `card ${tone}`; const top = document.createElement('div'); top.className = 'card-top'; top.append(text('strong', card.verdict.explanation)); top.append(text('span', `${card.branchId} · ${card.id}`,'small')); cardBox.append(top); cardBox.append(text('p', card.verdict.kind === 'gray' ? '纯执行：不打断人，进入日志。' : card.verdict.kind === 'blue' ? '自主决策：不阻断，进入蓝卡侧栏。' : card.verdict.kind === 'red' ? '约束冲突：执行前阻断，必须逐卡裁决。' : '')); const meta = document.createElement('div'); meta.className = 'card-meta'; meta.append(text('span', `记录员：${card.failureKind === 'recording-drift' ? '标记 drift' : '已记录'}`)); const evidence = card.verification ? `证据：${card.verification.source} / ${card.verification.kind} / ${card.verification.detail}` : '证据：未绑定'; meta.append(text('span', evidence)); meta.append(text('span', `运行尝试 ${card.runtimeAttempts}`)); cardBox.append(meta); const details = document.createElement('details'); details.className = 'details'; const summary = text('summary','展开 tool call / result / evidence'); details.append(summary); details.append(text('pre', `tool call\n${JSON.stringify(card.action.args, null, 2)}\n\nexecution\nstatus: ${card.executionStatus}\nexecutionId: ${card.executionId || '未执行'}\n\njudge / recorder\nverdict: ${card.verdict.kind}\nconfidence: ${findConfidence(card)}\nsource: judge + recorder`)); cardBox.append(details); if (card.state === 'pending') cardBox.append(decisionActions(card)); if (card.executionStatus === 'succeeded' && !card.verification) cardBox.append(button('仅记录人工复核（不转 green）', () => verifyHuman(card.id), '')); step.append(cardBox); root.append(step) }) }
  function findConfidence(card) { const event = state.timeline.find(item => item.type === 'card-created' && item.cardId === card.id); return event?.metadata?.confidence == null ? '未提供' : event.metadata.confidence }
  function decisionActions(card) { const wrap = document.createElement('div'); wrap.className = 'actions'; wrap.append(button('放行', () => decide(card.id, {kind:'allow'}))); (card.verdict.alternatives || []).slice(0,2).forEach(option => wrap.append(button(option, () => decide(card.id, {kind:'alternative', text:option})))); const input = document.createElement('input'); input.placeholder = '自由改写：后续必须…'; wrap.append(input); wrap.append(button('应用改写', () => { if (input.value.trim()) decide(card.id, {kind:'rewrite', text:input.value.trim()}) })); wrap.append(button('叫停', () => decide(card.id, {kind:'cancel'}), 'danger')); return wrap }
  function renderBlueCards() { const root = $('blueCards'); const cards = state.cards.filter(card => card.verdict.kind === 'blue'); $('blueCount').textContent = `${cards.length} 张`; root.replaceChildren(); if (!cards.length) { root.append(text('div','暂无蓝卡','empty')); return } cards.forEach(card => { const item = document.createElement('div'); item.className = `mini-card ${cardTone(card)}`; item.append(text('strong', `${card.action.description} · ${stateLabel(card)}`)); item.append(text('p', card.verdict.explanation)); item.append(text('div', `turn ${card.turn} · ${card.branchId} · ${card.verification ? card.verification.detail : '等待验证'}`,'small')); root.append(item) }) }
  function filteredEvents() { const agent = $('agentFilter').value, branch = $('branchFilter').value, type = $('eventFilter').value; return state.timeline.filter(event => (!agent || event.agentId === agent) && (!branch || event.branchId === branch) && (!type || event.type === type)) }
  function renderTimeline() { const all = filteredEvents(); const visible = playback < 0 ? all : all.slice(0, playback + 1); $('eventCount').textContent = `${visible.length} / ${all.length} events`; $('replayLabel').textContent = playback < 0 ? '完整' : `${visible.length} / ${all.length}`; $('progressBar').style.width = all.length ? `${visible.length / all.length * 100}%` : '0%'; const root = $('timeline'); root.replaceChildren(); if (!visible.length) { root.append(text('div','暂无符合条件的事件','empty')); return } visible.forEach(event => { const row = document.createElement('div'); row.className = 'event'; const line = document.createElement('div'); line.className = 'event-row'; line.append(text('span',`#${event.sequence}`,'seq')); line.append(text('b',`${event.type} · ${event.source}`)); line.append(text('span',`${event.agentId || 'system'} / ${event.branchId} / t${event.turn ?? '-'}·s${event.step ?? '-'}`,'small')); row.append(line); row.append(text('p',event.message)); root.append(row) }) }
  function renderBranches() { const root = $('branches'); root.replaceChildren(); state.branches.forEach(branch => { const row = document.createElement('div'); row.className = `branch ${branch.active ? 'active' : ''}`; row.append(text('div', `${branch.id}${branch.parentId ? ` ← ${branch.parentId}` : ''}`)); row.append(text('span', branch.active ? '活动' : branch.forkTurn == null ? '原始' : `fork turn ${branch.forkTurn}`,'small')); root.append(row) }); if (state.mode === 'rewind-and-fork') root.append(text('div','⚠ 外部副作用（邮件、网络请求等）不可由逻辑 fork 撤销。','notice warning')) }
  function renderReport() { const report = state.report; const root = $('reportContent'); root.replaceChildren(); const grid = document.createElement('div'); grid.className = 'statbar'; [['decisions','决策'],['allowed','执行成功'],['overrides','人的纠偏'],['verified','green 证据'],['runtimeFailures','运行失败']].forEach(([key,label]) => { const item = document.createElement('div'); item.className = 'stat'; item.append(text('b',report[key])); item.append(text('span',label)); grid.append(item) }); root.append(grid); const more = document.createElement('div'); more.className = 'report-grid'; [['cancelled','已叫停'],['selfDirected','自主拍板'],['recordingDeviations','记录偏差'],['verificationEvidence','executor evidence'],['irreversibleSideEffects','不可逆副作用'],['unverified','未验证'],['blockedHelp','升级求助'],['branches','分支']].forEach(([key,label]) => { const item = document.createElement('div'); item.className = 'report-item'; item.append(text('b',report[key])); item.append(text('span',label)); more.append(item) }); root.append(more); root.append(text('p',report.summary)); if (report.corrections?.length) { root.append(text('h3','人的关键纠偏')); report.corrections.forEach(item => { const correction = document.createElement('div'); correction.className = 'correction'; correction.append(text('strong',`${item.cardId} · ${item.mode}`)); correction.append(text('div',`前：${item.before}`)); correction.append(text('div',`后：${item.after}`)); root.append(correction) }) } const unresolved = state.cards.filter(card => card.state === 'failed' || (card.executionStatus === 'succeeded' && card.verificationStatus !== 'passed')); if (unresolved.length) { root.append(text('h3','尚未闭环')); unresolved.forEach(card => root.append(text('div',`${card.id}：${card.failureKind || '未验证'} · ${card.action.description}`,'small'))) } }
  async function decide(cardId, value) { if (decisionBusy) return; decisionBusy = true; try { await post(`/api/sessions/${encodeURIComponent(sessionId)}/cards/${encodeURIComponent(cardId)}/decision`, value); setNotice('裁决已记录。原动作与人的理由都保留在 append-only timeline。'); await refresh() } catch (error) { setNotice(`裁决失败：${error.message}`, 'error') } finally { decisionBusy = false } }
  async function verifyHuman(cardId) { try { await post(`/api/sessions/${encodeURIComponent(sessionId)}/verify`, {cardId, passed:true, detail:'人工复核已记录；等待受控 executor evidence'}); await refresh() } catch (error) { setNotice(error.message,'error') } }
  async function createSession(mode) { const created = await post('/api/sessions', {mode}); sessionId = created.sessionId; selectedMode = mode; await loadSessions(); return created }
  async function confirmSpec() { if (busy) return; busy = true; $('confirmButton').disabled = true; try { if (!sessionId || !state || state.spec) await createSession(selectedMode); await post(`/api/sessions/${encodeURIComponent(sessionId)}/spec`, {id:`spec-${Date.now()}`,request:$('request').value.trim(),constraints:lines($('constraint').value),confirmed:true}); setNotice(`spec 已确认，${modeLabel(selectedMode)} 已锁定。可以开始执行。`); await refresh() } catch (error) { setNotice(`无法确认 spec：${error.message}`,'error') } finally { busy = false; $('confirmButton').disabled = false } }
  async function action(value) { await post(`/api/sessions/${encodeURIComponent(sessionId)}/actions`, value); await wait(35); await refresh() }
  async function waitForCard(id) { for (let i=0;i<20;i++) { await wait(40); await refresh(); const card = state.cards.find(item => item.id === id); if (card && card.state !== 'pending' && card.executionStatus !== 'running') return card } return state.cards.find(item => item.id === id) }
  async function runDemo() { if (busy) return; busy = true; $('demoButton').disabled = true; try { selectedMode = selectedMode; await createSession(selectedMode); await post(`/api/sessions/${encodeURIComponent(sessionId)}/spec`, {id:'demo-spec',request:'做一个可验证的学生报名存储功能',constraints:['存储必须使用 Postgres，不允许 SQLite','核心流程必须可验证'],confirmed:true}); await refresh(); setNotice('演示 1/5：蓝卡自主选择将静默进入侧栏。'); await action({id:'demo-blue',tool:'choose_cache',kind:'write',description:'选择内存缓存方案',args:{provider:'memory'},agentId:'agent-research'}); setNotice('演示 2/5：红卡已阻断，等待裁决。'); await action({id:'demo-red',tool:'write_file',kind:'write',description:'选择 SQLite 存储报名信息',args:{path:'store/db.sqlite'},agentId:'agent-builder'}); const red = await waitForCard('demo-red'); if (!red || red.state !== 'pending') throw new Error('演示红卡没有进入等待状态'); await decide('demo-red', selectedMode === 'forward-only' ? {kind:'alternative',text:'后续统一使用 Postgres 存储，不允许 SQLite'} : {kind:'rewrite',text:'后续统一使用 Postgres 存储，不允许 SQLite'}); await wait(80); setNotice(`演示 3/5：${modeLabel(selectedMode)} 已生效，开始执行修正动作。`); await action({id:'demo-postgres',tool:'write_file',kind:'write',description:'使用 Postgres 兼容 schema 保存报名信息',args:{path:'store/db.sql',content:'-- demo schema\nCREATE TABLE registrations (id text primary key);'},specified:true,agentId:'agent-builder'}); await waitForCard('demo-postgres'); await action({id:'demo-evidence',tool:'local_check',kind:'validate',description:'运行报名 schema 本地检查',args:{target:'store/db.sql'},specified:true,agentId:'agent-verifier'}); await waitForCard('demo-evidence'); setNotice('演示 5/5 完成：请用 timeline 回放人的裁决，并查看一页报告。'); await refresh() } catch (error) { setNotice(`完整演示中断：${error.message}`,'error') } finally { busy = false; $('demoButton').disabled = false } }
  $('demoButton').addEventListener('click',runDemo); $('printButton').addEventListener('click',() => window.print()); $('confirmButton').addEventListener('click',confirmSpec); $('reportRefresh').addEventListener('click',refresh); $('sessionSelect').addEventListener('change', async event => { sessionId = event.target.value; playback = -1; await refresh() }); $('newSessionButton').addEventListener('click', async () => { if (busy) return; try { await createSession(selectedMode); state = null; await refresh(); setNotice(`新 session 已创建，模式锁定为 ${modeLabel(selectedMode)}。请确认 spec。`) } catch (error) { setNotice(error.message,'error') } }); document.querySelectorAll('.mode').forEach(node => node.addEventListener('click', () => { selectedMode = node.dataset.mode; document.querySelectorAll('.mode').forEach(item => item.classList.toggle('selected',item === node)); $('modeNotice').textContent = selectedMode === 'forward-only' ? '当前：forward-only。纠偏后原动作保留，约束只进入未来。' : '当前：rewind-and-fork。只从已完成 turn 边界 fork，原分支保留；外部副作用不可撤销。' })); ['agentFilter','branchFilter','eventFilter'].forEach(id => $(id).addEventListener('change', () => { playback = -1; renderTimeline() })); $('prevButton').addEventListener('click', () => { const count = filteredEvents().length; playback = count ? Math.max(0, playback < 0 ? count - 2 : playback - 1) : -1; renderTimeline() }); $('nextButton').addEventListener('click', () => { const count = filteredEvents().length; if (!count) return; playback = playback < 0 ? count - 1 : Math.min(count - 1, playback + 1); renderTimeline() }); $('playButton').addEventListener('click', () => { if (timer) { clearInterval(timer); timer = null; $('playButton').textContent = '自动播放'; return } const count = filteredEvents().length; if (!count) return; playback = 0; $('playButton').textContent = '暂停'; timer = setInterval(() => { if (playback >= count - 1) { clearInterval(timer); timer = null; $('playButton').textContent = '自动播放' } else playback += 1; renderTimeline() }, 700) }); loadSessions()
})()
